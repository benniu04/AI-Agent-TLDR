name: Daily TLDR

on:
  # Scheduling is handled EXTERNALLY by cron-job.org, which calls the workflow_dispatch API
  # at 8:20 AM ET on weekdays. GitHub's native `schedule:` cron was removed because it ran
  # 1-2 hours late (best-effort scheduler) — too late for a pre-commute read. cron-job.org
  # fires the dispatch within seconds and is timezone-aware (no DST drift).
  workflow_dispatch: {}  # external trigger (cron-job.org) + manual runs from the Actions tab

jobs:
  tldr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # allow committing the updated memory file back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent and deliver
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-haiku-4-5' }}
          DELIVERY: ${{ vars.DELIVERY || 'telegram' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          # Finance news APIs (get_finance_news)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # Twilio (DELIVERY=sms)
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SMS_RECIPIENTS: ${{ secrets.SMS_RECIPIENTS }}
          # Telegram (DELIVERY=telegram)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Persist memory
        if: success()  # only record what was actually delivered
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/seen.json
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "Update memory [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload trajectory logs
        if: always()  # keep logs even when the run fails, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: tldr-logs
          path: logs/
          if-no-files-found: ignore
