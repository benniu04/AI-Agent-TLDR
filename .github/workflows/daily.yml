name: Daily TLDR

on:
  schedule:
    # Cron is UTC. 12:00 UTC. Adjust to your desired local send time; note the
    # ±1h drift across daylight-saving changes (cron does not follow local DST).
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  tldr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent and deliver
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-sonnet-4-6' }}
          DELIVERY: ${{ vars.DELIVERY || 'sms' }}
          # Twilio (DELIVERY=sms)
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SMS_RECIPIENTS: ${{ secrets.SMS_RECIPIENTS }}
          # Telegram (DELIVERY=telegram)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Upload trajectory logs
        if: always()  # keep logs even when the run fails, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: tldr-logs
          path: logs/
          if-no-files-found: ignore
