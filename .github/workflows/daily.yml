name: Daily TLDR

on:
  schedule:
    # 13:00 UTC = 9:00 AM Eastern during daylight time (EDT, Mar-Nov).
    # GitHub cron is UTC and does NOT follow DST, so after the Nov switch to EST
    # this arrives at 8:00 AM. For exact 9 AM in winter, change to "0 14 * * *".
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  tldr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent and deliver
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-haiku-4-5' }}
          DELIVERY: ${{ vars.DELIVERY || 'telegram' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          # Finance news APIs (get_finance_news)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # Twilio (DELIVERY=sms)
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SMS_RECIPIENTS: ${{ secrets.SMS_RECIPIENTS }}
          # Telegram (DELIVERY=telegram)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Upload trajectory logs
        if: always()  # keep logs even when the run fails, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: tldr-logs
          path: logs/
          if-no-files-found: ignore
