name: Daily TLDR

on:
  schedule:
    # 12:20 UTC = 8:20 AM Eastern during daylight time (EDT, Mar-Nov) — early enough to
    # read before a 9 AM commute, with ~40 min of slack before then.
    # NOTE: minute is deliberately :20, NOT :00 — GitHub's scheduled runs are best-effort
    # and the top of the hour is the most congested slot, so :00 jobs are frequently delayed
    # or silently dropped. An off-peak minute plus the pre-9 buffer keeps it reliable.
    # GitHub cron is UTC and does NOT follow DST, so after the Nov switch to EST this arrives
    # at 7:20 AM. For ~8:20 AM in winter, change to "20 13 * * 1-5".
    # TEMPORARY: running EVERY day (incl. weekends) to confirm the schedule fires reliably
    # before relying on it. Revert to weekdays-only with "20 12 * * 1-5" (Mon-Fri) once
    # confirmed — markets are closed on weekends and finance news is sparse, so weekday-only
    # saves ~28% cost and fits a TLDR.
    - cron: "20 12 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  tldr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # allow committing the updated memory file back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent and deliver
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-haiku-4-5' }}
          DELIVERY: ${{ vars.DELIVERY || 'telegram' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          # Finance news APIs (get_finance_news)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # Twilio (DELIVERY=sms)
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SMS_RECIPIENTS: ${{ secrets.SMS_RECIPIENTS }}
          # Telegram (DELIVERY=telegram)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Persist memory
        if: success()  # only record what was actually delivered
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/seen.json
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "Update memory [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload trajectory logs
        if: always()  # keep logs even when the run fails, for debugging
        uses: actions/upload-artifact@v4
        with:
          name: tldr-logs
          path: logs/
          if-no-files-found: ignore
