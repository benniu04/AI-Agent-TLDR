name: Daily TLDR

on:
  # Scheduling is handled EXTERNALLY by cron-job.org, which calls the workflow_dispatch API
  # at 9:00 AM ET on weekdays. GitHub's native `schedule:` cron was removed because it ran
  # 1-2 hours late (best-effort scheduler) — too late for a pre-commute read. cron-job.org
  # fires the dispatch within seconds and is timezone-aware (no DST drift).
  workflow_dispatch:  # external trigger (cron-job.org) + manual runs from the Actions tab
    inputs:
      smoke:
        description: "Smoke test only — skip the paid agent run, verify plumbing for $0"
        type: boolean
        default: false

# Serialize runs so two overlapping runs can't race on the memory commit/push.
concurrency:
  group: daily-tldr
  cancel-in-progress: false

jobs:
  tldr:
    runs-on: ubuntu-latest
    timeout-minutes: 12  # > WALL_CLOCK_SECONDS (480s/8min) so the agent's graceful stop wins
    permissions:
      contents: write  # allow committing the updated memory file back to the repo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true  # the Persist-memory step pushes via this token

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Smoke test (no agent, no API cost)
        if: ${{ inputs.smoke }}  # verify plumbing (actions, deps, push auth) for $0
        run: |
          python -c "import agent, run, tools, memory, formatting, config, prompts; print('imports OK')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --dry-run origin HEAD:main && echo "push auth OK on checkout v6 (writes nothing)"

      - name: Run agent and deliver
        if: ${{ !inputs.smoke }}  # the only paid step — skipped in smoke mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL || 'claude-haiku-4-5' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/New_York' }}
          # Finance news APIs (get_finance_news)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # Telegram delivery
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Persist memory
        if: success()  # only record what was actually delivered
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/seen.json
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
            exit 0
          fi
          git commit -m "Update memory [skip ci]"
          # Rebase onto latest main before pushing in case it moved (human push / prior run);
          # retry a few times. A push failure is NON-fatal — the digest already delivered, and
          # the next run will re-record — so never red-X the job over a lost memory commit.
          ok=0
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase origin main && git push origin HEAD:main; then
              ok=1; break
            fi
            echo "memory push attempt $attempt failed; retrying in 3s..."
            sleep 3
          done
          [ "$ok" = "1" ] || echo "::warning::could not push memory update after 3 tries (non-fatal; next run re-records)"

      - name: Upload trajectory logs
        if: always()  # keep logs even when the run fails, for debugging
        uses: actions/upload-artifact@v7
        with:
          name: tldr-logs
          path: logs/
          if-no-files-found: ignore

      - name: Alert on failure
        if: failure()  # a prior step failed -> no digest went out; tell the user why
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Pure curl (no Python/deps) so the alert fires even if the failure was the agent/deps.
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Daily TLDR run failed — no digest today. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >/dev/null || true
